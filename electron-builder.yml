appId: com.fairyvr.fleetview
productName: FleetView
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
  # No Apple Developer cert. `identity: null` makes electron-builder ad-hoc sign,
  # which arm64 macOS requires — a fully unsigned build will not launch on Apple Silicon.
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  category: Development
