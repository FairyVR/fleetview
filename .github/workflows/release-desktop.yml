name: Build macOS + Linux release

# Windows is built locally (npm run dist). macOS dmgs and Linux AppImages each need their own
# OS to build, so they're produced here and attached to whatever release was just published.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the builds to (e.g. v0.4.1)
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
            artifacts: release/*.dmg
          - os: ubuntu-latest
            args: --linux --x64
            artifacts: release/*.AppImage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - run: gh release upload "$TAG" ${{ matrix.artifacts }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
